    });

      const avgLng = allCoords.reduce((s, c) => s + c[1], 0) / allCoords.length;

      L.marker([avgLat, avgLng], {
        icon: L.divIcon({
          className: 'kta-label',
          html: '<span style="color:red; font-weight:bold; font-size:16px;">КТА</span>',
        }),
      }).addTo(map);
    }


    points.forEach(p => {
      if (p.name === "KUFIM") {
        // KUFIM: овал
        const ovalHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="100" height="70">
            <ellipse cx="35" cy="25" rx="30" ry="15"
              fill="none" stroke="black" stroke-width="2"
              transform="rotate(-50 50 20)"/>
          </svg>
        `;

        const ovalIcon = L.divIcon({
          className: 'oval-icon',
          html: ovalHTML,
          iconSize: [100, 50],
          iconAnchor: [70, 12]
        });

        L.marker([p.lat, p.lng], { icon: ovalIcon }).addTo(map)
          .bindPopup(p.name);

      } else if (p.name === "DD004") {
        // DD004: овал
        const ovalHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="90" height="45">
            <ellipse cx="45" cy="22" rx="35" ry="14"
              fill="none" stroke="black" stroke-width="2" />
          </svg>
        `;
        const ovalIcon = L.divIcon({
          className: 'oval-icon',
          html: ovalHTML,
          iconSize: [90, 45],
          iconAnchor: [65, 10]
        });
        L.marker([p.lat, p.lng], { icon: ovalIcon }).addTo(map)
          .bindPopup(p.name);

      } else if (p.name === "DD002") {
        // DD002: овал под углом
        const ovalHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90">
            <ellipse cx="55" cy="25" rx="35" ry="14"
              fill="none" stroke="black" stroke-width="2"
              transform="rotate(40 55 25)" />
          </svg>
        `;

        const ovalIcon = L.divIcon({
          className: 'oval-icon',
          html: ovalHTML,
          iconSize: [90, 45],
          iconAnchor: [65, 10]
        });

        L.marker([p.lat, p.lng], { icon: ovalIcon }).addTo(map)
          .bindPopup(p.name);

      } else if (p.name === "TL303") {
        // TL303: овал
        const ovalHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="90" height="45">
            <ellipse cx="50" cy="22" rx="30" ry="12"
              fill="none" stroke="black" stroke-width="2" />
          </svg>
        `;
        const ovalIcon = L.divIcon({
          className: 'oval-icon',
          html: ovalHTML,
          iconSize: [90, 45],
          iconAnchor: [65, 10]
        });
        L.marker([p.lat, p.lng], { icon: ovalIcon }).addTo(map)
          .bindPopup(p.name);

      } else if (p.name !== "KTA") {
        L.marker([p.lat, p.lng], { icon: triangleIcon }).addTo(map);
        const label = L.divIcon({
          className: 'label-text',
          html: p.name,
          iconAnchor: [15, 25],
        });
        L.marker([p.lat, p.lng], { icon: label, interactive: false }).addTo(map);
      }
    });
  </script>
</body>
</html>
