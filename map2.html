          className: 'label-text',
          html: p.name,
          iconAnchor: [15, 25],
        });

    const pointMap = {};
    points.forEach(p => pointMap[p.name] = p);

    // Линии
    lines.forEach(line => {
      const from = pointMap[line.from];
      const to = pointMap[line.to];
      if (from && to) {
        L.polyline([[from.lat, from.lng], [to.lat, to.lng]], {
          color: line.color,
          weight: 2,
          dashArray: line.color === 'green' ? '5, 5' : null
        }).addTo(map);
      }
    });

    // Запретные зоны
    noFlyZones.forEach(noFlyZone => {
      L.circle([noFlyZone.center.lat, noFlyZone.center.lng], {
        radius: noFlyZone.radiusKm * 1000,
        color: 'red',
        fill: false
      }).addTo(map)

    });

          font-weight: bold;

    });

        L.polyline(rwy.ends.map(e => [e.lat, e.lng]), {
          color: 'black',
          weight: rwy.width / 8,
        }).addTo(map);
        allCoords.push(...rwy.ends.map(e => [e.lat, e.lng]));
      }

        icon: L.divIcon({
          className: 'kta-label',
          html: '<span style="color:red; font-weight:bold; font-size:16px;">КТА</span>',
        }),
      }).addTo(map);
    }

    
    points.forEach(p => {
      if (p.name === "AT234") {
        const ovalHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="80" height="40">
            <ellipse cx="40" cy="20" rx="32" ry="12"
              fill="none" stroke="black" stroke-width="2" />
          </svg>
        `;

        const ovalIcon = L.divIcon({
          className: 'oval-icon',
          html: ovalHTML,
          iconSize: [90, 30],
          iconAnchor: [60, 8]
        });

        L.marker([p.lat, p.lng], { icon: ovalIcon }).addTo(map)
          .bindPopup(p.name);

      } else if (p.name === "KUFIM") {
        const ovalHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="100" height="70">
            <ellipse cx="35" cy="25" rx="30" ry="15"
              fill="none" stroke="black" stroke-width="2"
              transform="rotate(-50 50 20)"/>
          </svg>
        `;

        const ovalIcon = L.divIcon({
          className: 'oval-icon',
          html: ovalHTML,
          iconSize: [100, 50],
          iconAnchor: [70, 12]
        });

        L.marker([p.lat, p.lng], { icon: ovalIcon }).addTo(map)
          .bindPopup(p.name);

      } else if (p.name === "ZT102") {
        const ovalHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="110" height="50">
            <ellipse cx="65" cy="25" rx="40" ry="15"
              fill="none" stroke="black" stroke-width="2" />
          </svg>
        `;

        const ovalIcon = L.divIcon({
          className: 'oval-icon',
          html: ovalHTML,
          iconSize: [110, 50],
          iconAnchor: [75, 15]
        });

        L.marker([p.lat, p.lng], { icon: ovalIcon }).addTo(map)
          .bindPopup(p.name);

      } else if (p.name === "DD003") {
        // DD003
        const ovalHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90">
            <ellipse cx="55" cy="25" rx="35" ry="14"
              fill="none" stroke="black" stroke-width="2"
              transform="rotate(30 40 15)" />
          </svg>
        `;

        const ovalIcon = L.divIcon({
          className: 'oval-icon',
          html: ovalHTML,
          iconSize: [90, 60],
          iconAnchor: [60, 20]
        });

        L.marker([p.lat, p.lng], { icon: ovalIcon }).addTo(map)
          .bindPopup(p.name);

      } else if (p.name !== "KTA") {
        L.marker([p.lat, p.lng], { icon: triangleIcon }).addTo(map);
        const label = L.divIcon({
          className: 'label-text',
          html: p.name,
          iconAnchor: [15, 25],
        });
        L.marker([p.lat, p.lng], { icon: label, interactive: false }).addTo(map);
      }
    });
  </script>
</body>
</html>
